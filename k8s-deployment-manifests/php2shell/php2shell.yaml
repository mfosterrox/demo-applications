apiVersion: apps/v1
kind: Deployment
metadata:
  name: php2shell
  namespace: php2shell
  labels:
    app: php2shell
    demo: roadshow
    repo: demo-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php2shell
  template:
    metadata:
      labels:
        app: php2shell
        demo: roadshow
        repo: demo-apps
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: php2shell
          image: quay.io/mfoster/php2shell:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: php2shell
  namespace: php2shell
  labels:
    app: php2shell
    demo: roadshow
    repo: demo-apps
spec:
  selector:
    app: php2shell
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: php2shell
  namespace: php2shell
  labels:
    app: php2shell
    demo: roadshow
    repo: demo-apps
spec:
  to:
    kind: Service
    name: php2shell
  port:
    targetPort: http
  tls:
    termination: edge

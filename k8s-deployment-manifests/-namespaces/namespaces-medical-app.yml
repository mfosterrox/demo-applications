# Namespace for operations
# The primary-user-defined-network label is only accepted when the namespace
# is created. These projects share one primary network so operations, backend,
# and payments can still reach each other.
apiVersion: v1
kind: Namespace
metadata:
  name: operations
  labels:
    name: operations
    demo: roadshow
    repo: demo-apps
    k8s.ovn.org/primary-user-defined-network: ""
---
# Namespace for backend
apiVersion: v1
kind: Namespace
metadata:
  name: backend
  labels:
    name: backend
    demo: roadshow
    repo: demo-apps
    k8s.ovn.org/primary-user-defined-network: ""
---
# Namespace for frontend
apiVersion: v1
kind: Namespace
metadata:
  name: frontend
  labels:
    name: frontend
    demo: roadshow
    repo: demo-apps
    k8s.ovn.org/primary-user-defined-network: ""
---
# Namespace for medical
apiVersion: v1
kind: Namespace
metadata:
  name: medical
  labels:
    name: medical
    demo: roadshow
    repo: demo-apps
    k8s.ovn.org/primary-user-defined-network: ""
---
# Namespace for payments
apiVersion: v1
kind: Namespace
metadata:
  name: payments
  labels:
    name: payments
    demo: roadshow
    repo: demo-apps
    k8s.ovn.org/primary-user-defined-network: ""
---
# One primary network for the medical application. A per-project network would
# isolate operations from medical and payments.
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: medical-application
spec:
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values:
          - backend
          - frontend
          - medical
          - operations
          - payments
  network:
    topology: Layer2
    layer2:
      role: Primary
      subnets:
        - "192.168.123.0/24"
---
# Namespace for yelb app
apiVersion: v1
kind: Namespace
metadata:
  name: pipeline-demo
  labels:
    name: pipeline-demo
    demo: roadshow
    repo: demo-apps
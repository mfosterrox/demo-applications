# Medical application projects share emea-customer-1.
# The primary-user-defined-network label is only accepted when the namespace is created.
apiVersion: v1
kind: Namespace
metadata:
  name: operations
  labels:
    name: operations
    app: emea-customer-1
    demo: roadshow
    repo: demo-apps
    k8s.ovn.org/primary-user-defined-network: ""
---
apiVersion: v1
kind: Namespace
metadata:
  name: backend
  labels:
    name: backend
    app: emea-customer-1
    demo: roadshow
    repo: demo-apps
    k8s.ovn.org/primary-user-defined-network: ""
---
apiVersion: v1
kind: Namespace
metadata:
  name: frontend
  labels:
    name: frontend
    app: emea-customer-1
    demo: roadshow
    repo: demo-apps
    k8s.ovn.org/primary-user-defined-network: ""
---
apiVersion: v1
kind: Namespace
metadata:
  name: medical
  labels:
    name: medical
    app: emea-customer-1
    demo: roadshow
    repo: demo-apps
    k8s.ovn.org/primary-user-defined-network: ""
---
apiVersion: v1
kind: Namespace
metadata:
  name: payments
  labels:
    name: payments
    app: emea-customer-1
    demo: roadshow
    repo: demo-apps
    k8s.ovn.org/primary-user-defined-network: ""
---
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: emea-customer-1
spec:
  namespaceSelector:
    matchLabels:
      app: emea-customer-1
  network:
    topology: Layer2
    layer2:
      role: Primary
      subnets:
        - "192.168.123.0/24"
---
# Namespace for yelb app
apiVersion: v1
kind: Namespace
metadata:
  name: pipeline-demo
  labels:
    name: pipeline-demo
    demo: roadshow
    repo: demo-apps
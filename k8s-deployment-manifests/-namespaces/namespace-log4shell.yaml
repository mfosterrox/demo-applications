# Log4Shell is emea-customer-2. The primary-user-defined-network label is
# only accepted when the namespace is created.
apiVersion: v1
kind: Namespace
metadata:
  name: log4shell
  labels:
    app: emea-customer-2
    demo: roadshow
    repo: demo-apps
    k8s.ovn.org/primary-user-defined-network: ""
---
apiVersion: k8s.ovn.org/v1
kind: ClusterUserDefinedNetwork
metadata:
  name: emea-customer-2
spec:
  namespaceSelector:
    matchLabels:
      app: emea-customer-2
  network:
    topology: Layer2
    layer2:
      role: Primary
      subnets:
        - "192.168.124.0/24"


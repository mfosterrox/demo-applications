# UBI keep-alive workload for RHACS File Activity Monitoring (FAM) labs.
# Trigger: oc debug -n acs-fam-demo deploy/fam-target --as-root -- touch /etc/passwd
apiVersion: v1
kind: Namespace
metadata:
  name: acs-fam-demo
  labels:
    demo: roadshow
    repo: demo-apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fam-target
  namespace: acs-fam-demo
  labels:
    app: fam-target
    demo: roadshow
    repo: demo-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fam-target
  template:
    metadata:
      labels:
        app: fam-target
        demo: roadshow
        repo: demo-apps
    spec:
      containers:
        - name: ubi
          image: registry.access.redhat.com/ubi9/ubi:latest
          command: ["sleep", "infinity"]
